services:
  postgres:
    image: postgres:16-alpine
    container_name: triage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: triage_user
      POSTGRES_PASSWORD: triage_pass
      POSTGRES_DB: triage_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage_user -d triage_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: triage_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
