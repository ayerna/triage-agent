# render.yaml — Render Blueprint
# Provisions PostgreSQL + FastAPI backend in one click.
# Deploy at: https://dashboard.render.com/select-repo?type=blueprint
#
# Required env vars to set manually in Render Dashboard after first deploy:
#   GROQ_API_KEY   — your Groq API key (never committed to git)
#   ALLOWED_ORIGINS — comma-separated list of allowed frontend origins
#                     e.g. https://your-frontend.onrender.com,http://localhost:5173

services:
  - type: web
    name: triage-agent-api
    runtime: docker
    repo: https://github.com/ayerna/triage-agent
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: triage-agent-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true          # Render generates a secure random value
      - key: GROQ_API_KEY
        sync: false                  # You set this manually in the Dashboard
      - key: ALLOWED_ORIGINS
        sync: false                  # Set to your Render frontend URL after deploy
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

databases:
  - name: triage-agent-db
    databaseName: triage_db
    user: triage_user
    plan: free
